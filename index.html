<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #333;
    }

    header {
      background: #222;
      color: white;
      padding: 20px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
    }

    nav a:hover {
      color: #00bcd4;
    }

    .hero {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, #00bcd4, #673ab7);
      color: white;
    }

    .hero h1 {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 1.2rem;
      margin-bottom: 25px;
    }

    .btn {
      display: inline-block;
      padding: 12px 25px;
      background: white;
      color: #333;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .btn:hover {
      background: #222;
      color: white;
    }

    .about {
      padding: 70px 10%;
      text-align: center;
      background: white;
    }

    .about h2 {
      margin-bottom: 20px;
      font-size: 2rem;
    }

    footer {
      background: #222;
      color: white;
      text-align: center;
      padding: 20px;
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
        gap: 15px;
      }

      nav a {
        margin: 0 8px;
      }

      .hero h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>

<body>

  <header>
    <h2>MyWebsite</h2>

    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero" id="home">
      <h1>Welcome to My Website</h1>
      <p>This webpage is built using HTML and CSS.</p>
      <a class="btn" href="#about">Learn More</a>
    </section>

    <section class="about" id="about">
      <h2>About Us</h2>
      <p>
        Add information about yourself, your company,
        project, or business here.
      </p>
    </section>
  </main>

  <footer id="contact">
    <p>&copy; 2026 MyWebsite. All rights reserved.</p>
  </footer>

</body>
</html>
